name: Multi-Platform Build (STM32 & Windows)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-pack:
    strategy:
      matrix:
        include:
          - preset: "stm32f401xc-st7735-debug"
            os: ubuntu-latest
          - preset: "stm32f411xe-st7735-debug"
            os: ubuntu-latest
          - preset: "win-st7735-debug"
            os: windows-latest
          - preset: "win-st7735-release"
            os: windows-latest
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Dependencies (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get install -y -q ninja-build

    - name: Install Arm GNU Toolchain (Linux)
      if: runner.os == 'Linux'
      uses: carlosperate/arm-none-eabi-gcc-action@v1
      with:
        release: '14.2.Rel1'

    - name: Set up MSVC Developer Command Prompt (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: cmake --preset ${{ matrix.preset }}

    - name: Build Firmware
      run: cmake --build --preset ${{ matrix.preset }} --parallel

    - name: Install and Organize SDK
      run: cmake --install build/${{ matrix.preset }} --prefix dist/${{ matrix.preset }} --component app

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: leto-console-${{ matrix.preset }}
        path: dist/${{ matrix.preset }}/
        if-no-files-found: error

  ctx-lint:
    name: Agent knowledge base
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Текст тоже расходится с кодом: переименованный пресет, удалённый путь,
    # скилл без триггера в описании. Проверяется здесь, а не при чтении.
    - name: Lint AGENTS.md and skills
      run: python3 scripts/ctx_lint.py . --issues
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Generated reference is up to date
      run: python3 scripts/gen_reference.py --check
